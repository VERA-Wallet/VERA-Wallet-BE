services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verawallet
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: vera
    ports:
      - "5432:5432"
    volumes:
      - vera-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera -d verawallet"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  vera-postgres:
